[build-system]
# 77: the first setuptools that reads an SPDX license expression. A build from the source archive
# therefore needs Python 3.9 or later; the wheel, which pip installs, still runs on 3.8.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakradar"
dynamic = ["version"]
description = "Official Python client for the LeakRadar.io API, sync and async"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LeakRadar", email = "contact@leakradar.io"}]
keywords = [
    "leakradar",
    "threat intelligence",
    "data breach",
    "leaked credentials",
    "infostealer",
    "stealer logs",
    "combolist",
    "dark web",
    "osint",
    "api client",
    "asyncio",
    "httpx",
]

# Below 1.0: the httpx 1.0 pre-releases on PyPI drop AsyncClient and the transports the clients are
# built on. anyio: the async clients sleep with it (asyncio or trio); httpx installs it too.
dependencies = ["httpx>=0.27,<1", "anyio"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Faster JSON: pip install "leakradar[speedups]". 5.4 fixed CVE-2022-31116 and CVE-2022-31117.
speedups = ["ujson>=5.4"]

[project.urls]
Homepage = "https://leakradar.io"
Documentation = "https://docs.leakradar.io"
Source = "https://github.com/LeakRadar/leakradar-wrapper"
Changelog = "https://github.com/LeakRadar/leakradar-wrapper/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["leakradar", "leakradar.*"]

[tool.setuptools.package-data]
leakradar = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "leakradar._version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.ruff]
# requires-python is >=3.8: ruff reports newer syntax, tests/test_python_compat.py newer runtime APIs.
target-version = "py38"
# The code wraps at about 120 columns (99 % of client.py's lines). E501 is not selected: the few
# longer signatures and strings stay as they are, the length only drives import wrapping.
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.pyupgrade]
# Keep typing.List / Optional even in a module with `from __future__ import annotations`:
# integrations read the annotations with typing.get_type_hints(), which cannot evaluate
# list[str] or X | None on Python 3.8 and 3.9. No rule requires that future import either.
keep-runtime-typing = true

[tool.mypy]
# The lowest target the pinned mypy (requirements.txt) accepts. Python 3.8 and 3.9 are checked
# by the CI test matrix and tests/test_python_compat.py.
python_version = "3.10"
files = ["leakradar"]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
